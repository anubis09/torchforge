[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"

[project]
name = "torchforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jaxtyping>=0.3.9",
    "matplotlib>=3.10.9",
    "numpy>=2.4.4",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchmetrics>=1.9.0",
]

[tool.ruff]
line-length = 88
ignore = ["F722"]

[tool.basedpyright]
typeCheckingMode = "standard"
reportPrivateImportUsage = "none"
